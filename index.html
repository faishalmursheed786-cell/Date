<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glass border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden min-h-[420px] flex flex-col justify-center">

        <!-- STEP 1: Khana Khane Chalogi? -->
        <div id="step1" class="space-y-6">
            <div class="w-16 h-16 mx-auto rounded-full bg-pink-500/20 border border-pink-500/40 flex items-center justify-center text-pink-400 text-2xl">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Ek choti si request hai...</h2>
            <p class="text-slate-300 text-lg">Kya tum mere sath dinner (khana) khane chalogi?</p>
            <div class="flex gap-4 justify-center pt-4">
                <button onclick="nextStep(2)" class="px-6 py-3 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold transition shadow-lg shadow-pink-600/30">Haan, zaroor! 😊</button>
                <button id="noBtn" onmouseover="dodgeButton()" ontouchstart="dodgeButton()" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold transition border border-slate-600 relative">Nhi</button>
            </div>
        </div>

        <!-- STEP 2: Dost se baat krwao (Noor & Zoya) -->
        <div id="step2" class="space-y-6 hidden">
            <div class="w-16 h-16 mx-auto rounded-full bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-400 text-2xl">
                <i class="fa-solid fa-user-group"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Pehle apne kisi dost se baat karwao!</h2>
            <p class="text-slate-300 text-sm">Kisse baat karwaogi? Choose one:</p>
            <div class="flex flex-col gap-3 pt-2 relative h-36" id="friendArea">
                <button onclick="nextStep(3)" class="w-full py-3.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold transition shadow-lg">Noor</button>
                <!-- Zoya button jo upar-neche bhagega -->
                <button id="zoyaBtn" onmouseover="dodgeZoya()" ontouchstart="dodgeZoya()" onclick="nextStep(3)" class="w-full py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold transition border border-slate-600 absolute bottom-0 left-0">Zoya</button>
            </div>
        </div>

        <!-- STEP 3: Indian Menu Selection -->
        <div id="step3" class="space-y-6 hidden">
            <div class="w-14 h-14 mx-auto rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-2xl">
                <i class="fa-solid fa-bowl-food"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Menu select karo, kya khaogi?</h2>
            <div class="grid grid-cols-2 gap-3 text-left max-h-48 overflow-y-auto pr-1">
                <label class="glass p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer hover:border-amber-500 transition">
                    <input type="radio" name="menu" value="Butter Chicken & Naan" class="accent-amber-500">
                    <span class="text-xs font-semibold">Butter Chicken</span>
                </label>
                <label class="glass p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer hover:border-amber-500 transition">
                    <input type="radio" name="menu" value="Paneer Tikka Masala" class="accent-amber-500">
                    <span class="text-xs font-semibold">Paneer Tikka</span>
                </label>
                <label class="glass p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer hover:border-amber-500 transition">
                    <input type="radio" name="menu" value="Hyderabadi Biryani" class="accent-amber-500">
                    <span class="text-xs font-semibold">Biryani</span>
                </label>
                <label class="glass p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer hover:border-amber-500 transition">
                    <input type="radio" name="menu" value="Dal Makhani & Jeera Rice" class="accent-amber-500">
                    <span class="text-xs font-semibold">Dal Makhani</span>
                </label>
            </div>
            <button onclick="finalizeOrder()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold transition shadow-lg">Finalize Order 🍽️</button>
        </div>

        <!-- STEP 4: Success / Finalized Screen -->
        <div id="step4" class="space-y-6 hidden">
            <div class="w-16 h-16 mx-auto rounded-full bg-green-500/20 border border-green-500/40 flex items-center justify-center text-green-400 text-3xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Confirmed! 🎉</h2>
            <p id="finalChoiceText" class="text-slate-300 text-base font-medium"></p>
            <p class="text-xs text-slate-400">Date fix ho gayi hai!</p>
        </div>

    </div>

    <script>
        function nextStep(stepNum) {
            document.querySelectorAll('#step1, #step2, #step3, #step4').forEach(el => el.classList.add('hidden'));
            document.getElementById('step' + stepNum).classList.remove('hidden');
        }

        // 'Nhi' button ko dodge karne ke liye (Step 1)
        function dodgeButton() {
            const btn = document.getElementById('noBtn');
            const randomX = Math.floor(Math.random() * 120) - 60;
            const randomY = Math.floor(Math.random() * 80) - 40;
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // 'Zoya' button ko upar-neeche bhagane ke liye (Step 2)
        function dodgeZoya() {
            const btn = document.getElementById('zoyaBtn');
            const currentTop = btn.style.top === '0px' ? '70px' : '0px';
            btn.style.top = currentTop;
        }

        // Final menu selection
        function finalizeOrder() {
            const selected = document.querySelector('input[name="menu"]:checked');
            if(!selected) {
                alert('Pehle koi ek dish toh select karo!');
                return;
            }
            document.getElementById('finalChoiceText').innerText = `Tumne select kiya hai: "${selected.value}". Yeh final ho gaya!`;
            nextStep(4);
        }
    </script>
</body>
</html>
